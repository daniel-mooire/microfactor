formula:
  expression: TP=(adjusted_high+adjusted_low+adjusted_close)/3; MF=TP*volume; MR=Sum(MF where TP>TP[-1],14)/Sum(MF where TP<TP[-1],14);
    MFI=100-100/(1+MR)
  variables:
  - name: high
    meaning: 当日未复权最高价；需要时与同日复权比例相乘得到后复权最高价
  - name: low
    meaning: 当日未复权最低价；需要时与同日复权比例相乘得到后复权最低价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 后复权收盘价，用来消除分红、送股等公司行为造成的机械跳变
  - name: volume
    meaning: 当日成交股数
  interpretation: 把价格上涨日和下跌日的成交资金作比较，看近14天哪一边更占优势。
  beginner_explanation:
    one_sentence: 把价格上涨日和下跌日的成交资金作比较，看近14天哪一边更占优势。
    steps:
    - 每天用最高、最低、收盘价的平均值乘成交量，估算资金流量。
    - 代表价格上涨时计入正向流量，下跌时计入负向流量，再用14日两者之比换算成0到100的指标。
    high_value: 上涨日承载的成交资金明显多于下跌日，数值接近100。
    low_value: 下跌日承载的成交资金占优，数值接近0。
    example: 14日正向资金为3000万元、负向为1000万元时，资金比=3，MFI=100-100/(1+3)=75。
    watch_out: 这只是用典型价格乘成交量作近似，不是账户资金净流入；负向流量为0时会落在公式极限。 本次正式样本RankIC为-0.0443，Q1费前年化超额为1.89%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0443，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
