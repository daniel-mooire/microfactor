  most_important_risk: 优选档有正超额，但年单边换手27.14倍，费用和冲击可能吞噬收益。
risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 13个命名因子在同一样本集中评估，存在多重检验和样本内筛选偏差。
- 聚宽未披露所有停牌边界和滚动算子细节，不能声称逐行完全一致。
- 优选档有正超额，但年单边换手27.14倍，费用和冲击可能吞噬收益。
