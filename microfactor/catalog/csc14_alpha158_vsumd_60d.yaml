formula:
  expression: (Sum(Greater($volume-Ref($volume,1),0),60)-Sum(Greater(Ref($volume,1)-$volume,0),60))/(Sum(Abs($volume-Ref($volume,1)),60)+1e-12)
  variables:
  - name: volume
    meaning: 当日成交股数
  interpretation: 比较过去60天成交量增加和减少的总幅度，看缩量还是放量变化占主导。
  beginner_explanation:
    one_sentence: 比较过去60天成交量增加和减少的总幅度，看缩量还是放量变化占主导。
    steps:
    - 逐日计算成交量比前一天增加或减少了多少股。
    - 分别加总60天内所有增加量和所有减少量。
    - 用“增加总量减减少总量”除以两者之和，结果大致在-1到1之间。
    high_value: 成交量增加的累计幅度占主导，近期整体偏放量。
    low_value: 成交量减少的累计幅度占主导，近期整体偏缩量；正式样本偏好这一端。
    example: 增加总量300万股、减少总量100万股时，因子=(300-100)/(300+100)=0.50。
    watch_out: 计算60段变化实际需要61天数据；Q1费前年化超额3.54%、年单边换手约28倍，费用压力较大。
