formula:
  expression: ROC_6=100*(close/close[t-6]-1)
  variables:
  - name: close
    meaning: 当日未复权收盘价
  interpretation: 直接看今天收盘价相对6个交易日前涨跌了多少。
  beginner_explanation:
    one_sentence: 直接看今天收盘价相对6个交易日前涨跌了多少。
    steps:
    - 找到今天和6个交易日前的收盘价。
    - 用今天价格除以过去价格再减1。
    - 乘100得到6日涨跌百分比。
    high_value: 最近6天涨幅较大，属于短期强势。
    low_value: 最近6天涨幅较小或下跌；本样本低值档本身仍未取得正毛超额。
    example: 收盘价从10元涨到11元，ROC6为10%；跌到9元则为-10%。
    watch_out: 公式使用未复权收盘价，跨除权窗口可能失真；高换手和费用风险也很大。
