formula:
  expression: Mean(turnover_d, d in (t-1m,t])
  variables:
  - name: turnover_percent
    meaning: 当日换手率百分比
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 看最近1个月每天平均有多少流通筹码换了主人，越高越热门也越拥挤。
  beginner_explanation:
    one_sentence: 看最近1个月每天平均有多少流通筹码换了主人，越高越热门也越拥挤。
    steps:
    - 取最近N个自然月每天的换手率，明确停牌且缺失的换手记为0。
    - 把有效日换手率求平均，得到近期平均交易热度。
    high_value: 最近每天换手的流通筹码较多，股票更热门。
    low_value: 最近成交相对冷清。
    example: 三天换手率1%、2%、3%，日均换手率就是2%。
    watch_out: 它和固定20日换手率同族，但自然月边界不同，不能当成完全相同公式。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0761，因此当前样本优选低值端；这不是未来收益保证。
