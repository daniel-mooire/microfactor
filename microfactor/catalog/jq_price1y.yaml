formula:
  expression: adjusted_close_t / Mean(adjusted_close, 250)_t - 1
  variables:
  - name: adjusted_close
    meaning: 后复权收盘价，用来消除分红、送股等公司行为造成的机械跳变
  interpretation: 比较今天股价和过去一年的平均价，看它处在长期价格中枢的上方还是下方。
  beginner_explanation:
    one_sentence: 比较今天股价和过去一年的平均价，看它处在长期价格中枢的上方还是下方。
    steps:
    - 取最近250个交易日的后复权收盘价并算平均值。
    - 用今天的后复权收盘价除以这个平均值，再减1。
    high_value: 今天明显高于一年均价，过去一年的价格趋势相对偏强。
    low_value: 今天低于一年均价，股价处在长期价格中枢下方。
    example: 一年均价是10元、今天是12元时，因子=12/10-1=0.20，也就是高出20%。
    watch_out: 它既可能代表强势延续，也可能代表涨得过多；250日窗口还会让新股长期没有数值。 本次正式样本RankIC为-0.0716，Q1费前年化超额为5.87%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0716，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
