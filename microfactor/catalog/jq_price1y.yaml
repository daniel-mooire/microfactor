risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 13个命名因子在同一样本集中评估，存在多重检验和样本内筛选偏差。
- 聚宽未披露所有停牌边界和滚动算子细节，不能声称逐行完全一致。
- 同日截面因子值与以下因子高度相关，组合前应做残差化或择一：jq_mac120(-0.822)。
- 绝对RankIC达到0.0716，强度异常，必须先审计泄漏、暴露和样本外稳定性。
