formula:
  expression: Quantile($close,60,0.2)/$close
  variables:
  - name: adjusted_close
    meaning: 后复权收盘价
  interpretation: 把过去60天较低位置的参考价除以今天价格，看今天是否靠近历史下沿。
  beginner_explanation:
    one_sentence: 把过去60天较低位置的参考价除以今天价格，看今天是否靠近历史下沿。
    steps:
    - 把最近60天后复权收盘价从低到高排列。
    - 取20%分位数，作为过去60天偏低价格区间的参考线。
    - 用这个较低参考价除以今天收盘价。
    high_value: 今天价格更靠近过去60天的低位参考线。
    low_value: 今天价格远高于过去60天的低位参考线。
    example: 60日20%分位价为8元，今天收9元时因子约0.89；今天收12元时约0.67。
    watch_out: Q5费前年化超额2.64%、年单边换手约20倍；因子是从大规模候选中样本内选出，且与QTLU60同族。
