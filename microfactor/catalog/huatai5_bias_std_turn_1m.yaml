formula:
  expression: std_turn_1m / std_turn_24m - 1
  variables:
  - name: turnover_percent
    meaning: 当日换手率百分比
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 比较最近1个月交易热度的忽冷忽热程度与过去两年常态，正数说明近期更反常。
  beginner_explanation:
    one_sentence: 比较最近1个月交易热度的忽冷忽热程度与过去两年常态，正数说明近期更反常。
    steps:
    - 分别计算最近N个月和最近24个月日换手率的总体标准差。
    - 用短期标准差除以24个月标准差再减1，衡量近期交易热度是否比常态更不稳定。
    high_value: 近期换手率比过去两年更忽冷忽热。
    low_value: 近期换手波动低于自己的两年常态。
    example: 近3个月换手标准差1.5%，24个月为1.0%，因子值为1.5/1.0-1=50%。
    watch_out: 分母接近0会导致缺失；高低值都不自动代表值得买，需看评估方向。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0728，因此当前样本优选低值端；这不是未来收益保证。
