formula:
  expression: factor[i,t] = Std_20(r_total[i,*], ddof=0)
  variables:
  - name: r_total
    meaning: 单日收盘到收盘总回报率
  - name: Std_20
    meaning: 最近20个完整交易日的总体标准差
  interpretation: 统计最近20天每日涨跌幅偏离平均水平的程度；数值越大，说明股价每天的波动越剧烈。
  beginner_explanation:
    one_sentence: 看一只股票最近一个月坐“过山车”的程度有多大。
    steps:
    - 计算最近20个交易日每天的涨跌幅。
    - 比较这些涨跌幅与其平均值相差多远。
    - 差距整体越大，标准差越大，波动率分数就越高。
    high_value: 股票最近经常大涨大跌，价格路径不稳定。
    low_value: 股票最近每天的涨跌幅相对温和，价格路径更稳定。
    example: 一只股票经常在+5%和-5%之间跳动，会比每天只波动约1%的股票得到更高分。
    watch_out: 低波动不等于低风险；停牌、流动性差或价格不活跃也可能让表面波动变低。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC显著为负，低波动端更优，方向一致。
implementation:
  path: src/quant_hive/factor.py
