evaluation:
  suite_id: base_panel_bottom1000_5d
  result_path: research/model-pipeline/output/evaluations/volatility/factor_result.json
  factor_values_path: research/model-pipeline/output/evaluations/volatility/factor_values.parquet
assessment:
  verdict: promising_research_signal
  summary: 绝对RankIC较高且方向稳定，低波Q1费前年化超额约2.7%；但单调性主要体现为高波尾部很差，long-only收益仍偏低。
  most_important_risk: 低波可能代理流动性、停牌风险、涨跌停状态或残余规模，需要正交化检验。
risks:
- 不含交易成本和容量约束。
- 未做行业、市值和流动性中性化。
- 未核实唯一原始研报来源。
