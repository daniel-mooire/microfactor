formula:
  expression: 100*(volume_t-volume_t[-6])/volume_t[-6]
  variables:
  - name: volume
    meaning: 当日成交股数
  interpretation: 比较今天和6个交易日前的成交量，看短期是放量还是缩量。
  beginner_explanation:
    one_sentence: 比较今天和6个交易日前的成交量，看短期是放量还是缩量。
    steps:
    - 用今天成交量减去6个交易日前的成交量。
    - 再除以6日前成交量并乘100，得到百分比变化。
    high_value: 今天相对6日前明显放量。
    low_value: 今天相对6日前明显缩量，可能为负数。
    example: 成交量从6日前的1000万股升到1500万股时，VROC6=100*(1500-1000)/1000=50。
    watch_out: 只比较两个日期，容易被单日异常成交放大；6日前成交量为0时没有结果。 本次正式样本RankIC为-0.0332，Q1费前年化超额为0.70%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0332，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
