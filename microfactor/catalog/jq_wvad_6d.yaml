formula:
  expression: Sum(((adjusted_close-adjusted_open)/(adjusted_high-adjusted_low))*volume,6)
  variables:
  - name: open
    meaning: 当日未复权开盘价；需要时与同日复权比例相乘得到后复权开盘价
  - name: high
    meaning: 当日未复权最高价；需要时与同日复权比例相乘得到后复权最高价
  - name: low
    meaning: 当日未复权最低价；需要时与同日复权比例相乘得到后复权最低价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 后复权收盘价，用来消除分红、送股等公司行为造成的机械跳变
  - name: volume
    meaning: 当日成交股数
  interpretation: 根据每天收盘相对开盘的强弱、全天振幅和成交量，累加6天的多空力度。
  beginner_explanation:
    one_sentence: 根据每天收盘相对开盘的强弱、全天振幅和成交量，累加6天的多空力度。
    steps:
    - 每天用收盘价减开盘价，再除以最高价减最低价，得到收盘方向占全天振幅的比例。
    - 把这个比例乘成交量，并将最近6天结果相加。
    high_value: 多天收盘强于开盘且成交量大，累计值偏正。
    low_value: 多天收盘弱于开盘且成交量大，累计值偏负。
    example: 某日开10元、收10.5元、高11元、低9元且成交1000万股，当日贡献=(0.5/2)*1000万=250万。
    watch_out: 最高价等于最低价时当日无法计算，并会使所在6日窗口失效；成交规模暴露也很明显。 本次正式样本RankIC为-0.0340，Q1费前年化超额为-4.15%。
