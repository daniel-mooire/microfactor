formula:
  expression: 'EP[i,t] = 1 / PE_TTM[i,t], only when PE_TTM[i,t] > 0

    factor[i,t] = EP[i,t] - EP[i,t-60]

    '
  variables:
  - name: PE_TTM
    meaning: 用最近12个月利润计算的滚动市盈率；亏损或非正值记为缺失
  - name: EP
    meaning: 市盈率的倒数，即每1元股价对应多少元最近12个月利润
  - name: t-60
    meaning: 60个交易日前的同一只股票
  interpretation: 不是只比较谁现在便宜，而是比较一只股票最近60个交易日是否朝更便宜的方向变化。
  beginner_explanation:
    one_sentence: 看一只股票最近三个月是不是变得更便宜，而不只是现在看起来便不便宜。
    steps:
    - 把今天的PE_TTM取倒数，得到今天每1元股价对应的利润。
    - 把60个交易日前的PE_TTM也取倒数。
    - 用今天的倒数减去60日前的倒数；结果越大，说明相对过去变得越便宜。
    high_value: 股票的盈利收益率明显上升，可能是股价变便宜或公司最近12个月利润改善。
    low_value: 股票相对60日前变贵，或盈利能力变弱；负数不等于股价一定会跌。
    example: PE_TTM从40倍降到20倍，盈利收益率从2.5%升到5%，因子值为2.5个百分点。
    watch_out: 因子变高既可能因为股价下跌，也可能因为利润上升；亏损公司的PE没有经济意义，本研究直接留空。
direction:
  expected: positive
  selection: high
  meaning: 先验认为变得更便宜的股票更优；正式样本RankIC为正，优选Q5。
implementation:
  path: research/factor-provenance/reports/scripts/report_factors.py
