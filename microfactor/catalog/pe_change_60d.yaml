assessment:
  verdict: promising_research_signal
  summary: RankIC约0.0399、raw ICIR约0.431、五档单调性约0.895，Q5费前年化超额约3.0%；排序有效，但平均覆盖率只有64.1%。
  most_important_risk: 只在正PE盈利公司中可计算，结果可能同时反映盈利公司筛选，而不只是估值变化本身。
risks:
- PE_TTM由T日收盘后的daily_basic提供，信号只可用于T+1及以后交易。
- 正PE筛选造成明显样本选择，不能与全Universe覆盖因子直接横比。
- 60日差分会同时混合价格变化与利润口径变化。
- 未做行业或市值中性化，可能含行业估值与规模暴露。
