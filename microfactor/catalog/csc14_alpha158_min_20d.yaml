formula:
  expression: Min($low,20)/$close
  variables:
  - name: low
    meaning: 当日未复权最低价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 后复权收盘价
  interpretation: 用过去20天的最低价除以今天收盘价，判断今天离近期低点有多远。
  beginner_explanation:
    one_sentence: 用过去20天的最低价除以今天收盘价，判断今天离近期低点有多远。
    steps:
    - 找出最近20个交易日后复权最低价中的最小值。
    - 用这个近期最低价除以今天的后复权收盘价。
    high_value: 比值接近1，说明今天仍靠近近期低点。
    low_value: 今天价格已经明显高于近期低点。
    example: 20日最低价8元，今天收10元时因子为0.80；今天收12元时只有0.67。
