formula:
  expression: 'for every trading day in calendar month c: mean(amount_CNY[i,d], d in completed calendar months c-6 through
    c-1)'
  variables:
  - name: amount_CNY[i,d]
    meaning: 股票 i 在交易日 d 的成交额，单位为人民币元
  - name: c
    meaning: 当前自然月；计算只使用 c 之前已经完整结束的6个自然月
  interpretation: 把过去6个完整自然月的总成交额除以有效交易日数，观察较长期的平均交易热度。数值越高表示长期成交更活跃，也可能承载流动性或拥挤暴露。
  beginner_explanation:
    one_sentence: 看一只股票过去半年平均每天成交多少钱，数字越大越热闹。
    steps:
    - 只取当前月之前已经完整结束的6个自然月，不使用本月数据。
    - 把这6个月每天的成交额相加，再除以其中有效交易日总数。
    - 把结果沿用到当前自然月的每个交易日，下个月再滚动更新。
    high_value: 高分表示过去半年平均每天成交的钱更多，股票长期交易更活跃。
    low_value: 低分表示过去半年成交较冷清；正式样本中低值端相对表现更好。
    example: 若6个月总成交额为600亿元、有效交易日为120天，因子就是日均5亿元。
    watch_out: 低成交额可能只是流动性差和容量小，不能把低值端收益全部解释成选股能力。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0469，因此当前样本优选低值端；这不是未来收益保证。
