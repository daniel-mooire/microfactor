formula:
  expression: AR_N=100*SUM_N(high-open)/SUM_N(open-low); BR_N=100*SUM_N(max(0,high-close[t-1]))/SUM_N(max(0,close[t-1]-low));
    factor=AR_20
  variables:
  - name: open
    meaning: 当日未复权开盘价
  - name: high
    meaning: 当日未复权最高价
  - name: low
    meaning: 当日未复权最低价
  interpretation: 比较最近20天价格从开盘向上冲和向下压的累计力量。
  beginner_explanation:
    one_sentence: 比较最近20天价格从开盘向上冲和向下压的累计力量。
    steps:
    - 每天分别计算最高价减开盘价、开盘价减最低价。
    - 把最近20天的向上距离和向下距离各自加总。
    - 用向上总距离除以向下总距离并乘100。
    high_value: 盘中向上冲的累计幅度相对更大，交易情绪偏热。
    low_value: 盘中向上力量相对较弱；当前样本偏好低值端。
    example: 20天向上距离合计4元、向下距离合计2元，AR等于200。
    watch_out: AR20是从本样本19项快速结果中再挑出的探索项，多重检验会夸大表现。
