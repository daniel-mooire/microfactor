formula:
  expression: MaxRet[i,t] = max(d=1..21, r[i,t-d])
  variables:
  - name: r[i,d]
    meaning: 股票 i 在交易日 d 的后复权收盘到收盘简单收益率，小数表示
  - name: t
    meaning: 上一个已经结束的自然月最后一个交易日
  interpretation: 每月末找过去21个交易日里最大的一次单日上涨。数值越高，说明近期出现过更强的冲高或投机热度；来源研究偏向低值端。
  beginner_explanation:
    one_sentence: 找最近一个月涨得最猛的那一天，用那天的涨幅当分数。
    steps:
    - 在上个自然月末，列出此前21个交易日的每日涨跌幅。
    - 从中挑出最大的单日涨幅，直接作为因子值。
    - 把这个值沿用到当前自然月，下个月末再重新寻找。
    high_value: 高分表示近期出现过一次很强的单日冲高，交易情绪可能较热。
    low_value: 低分表示过去21天没有特别强的单日上涨，来源研究更偏向这一端。
    example: 若21天里最高单日上涨是8%，因子值就是0.08。
    watch_out: 它只看最好的一天，不代表整个月都在上涨；正式结果也是低值端相对更好。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0431，因此当前样本优选低值端；这不是未来收益保证。
