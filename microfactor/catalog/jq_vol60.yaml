formula:
  expression: Mean(jq_turnover_ratio_pct, 60)_t
  variables:
  - name: jq_turnover_ratio_pct
    meaning: 成交股数 / 流通股本股数 * 100；分母是 float_share，不是自由流通股本 free_share
  interpretation: 看过去约一季度平均每天有多少流通股本被交易。
  beginner_explanation:
    one_sentence: 看过去约一季度平均每天有多少流通股本被交易。
    steps:
    - 每天计算成交股数占流通股本 float_share 的百分比。
    - 对最近60个交易日的换手率取平均。
    high_value: 一季度内筹码交换频繁，交易活跃。
    low_value: 一季度内筹码交换较少，交易冷清。
    example: 60天换手率合计120%时，VOL60=120%/60=2%。
    watch_out: 它可能是流动性、拥挤度或投机热度的混合暴露，且分母不能换成 free_share。 本次正式样本RankIC为-0.0597，Q1费前年化超额为5.53%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0597，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
