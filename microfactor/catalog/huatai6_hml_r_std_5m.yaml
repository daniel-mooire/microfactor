formula:
  expression: high_r_std_5m - low_r_std_5m
  variables:
  - name: high
    meaning: 当日未复权最高价
  - name: low
    meaning: 当日未复权最低价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 当日后复权收盘价
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 比较上冲不稳定性与下探不稳定性谁更强。 观察窗口是最近5个月。
  beginner_explanation:
    one_sentence: 比较上冲不稳定性与下探不稳定性谁更强。 观察窗口是最近5个月。
    steps:
    - 分别计算盘中最高涨幅和最低涨跌幅在N个月内的标准差。
    - 用上冲标准差减去下探标准差。
    high_value: 上冲的不稳定程度大于下探的不稳定程度。
    low_value: 下探的不稳定程度更强。
    example: 上冲标准差4%、下探标准差3%，因子值为1个百分点。
    watch_out: 这是两个波动率的差，不是最高价减最低价。
