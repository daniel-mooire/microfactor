formula:
  expression: Corr($close/Ref($close,1),Log($volume/Ref($volume,1)+1),20)
  variables:
  - name: adjusted_close
    meaning: 后复权收盘价
  - name: volume
    meaning: 当日成交股数
  interpretation: 看最近20天里，价格日变化和成交量日变化是否经常同方向。
  beginner_explanation:
    one_sentence: 看最近20天里，价格日变化和成交量日变化是否经常同方向。
    steps:
    - 每天用今天收盘价除以昨天收盘价，得到价格变化比。
    - 每天计算ln(今天成交量/昨天成交量+1)，得到研报定义的成交量变化值。
    - 对最近20天两条序列计算相关性。
    high_value: 价格走强时成交量变化值通常也高，两条序列偏同向。
    low_value: 价格与成交量变化偏反向；正式样本偏好这一端。
    example: 若多数上涨日同时放量、下跌日同时缩量，两条序列通常正相关；反过来则相关性偏低或为负。
    watch_out: Q1费前年化超额3.71%、年单边换手约20倍；公式中的成交量变换并非常见的对数收益，且仍有样本内筛选偏差。
