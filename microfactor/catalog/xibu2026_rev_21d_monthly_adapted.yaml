formula:
  expression: REV[i,t] = -sum(d=1..21, r[i,t-d])
  variables:
  - name: r[i,d]
    meaning: 股票 i 在交易日 d 的后复权收盘到收盘简单收益率，小数表示
  - name: t
    meaning: 上一个已经结束的自然月最后一个交易日
  interpretation: 每月末观察过去21个交易日整体涨跌并取反。近期跌得越多，分数越高，用于识别可能跌过头的股票；分数在下一个自然月内保持不变。
  beginner_explanation:
    one_sentence: 看一只股票最近一个月是不是跌得比较多，跌得越多分数越高。
    steps:
    - 在上个自然月最后一个交易日收盘后，取此前21个交易日的每日涨跌幅。
    - 把21个涨跌幅相加，再把正负号反过来。
    - 把这个分数沿用到当前自然月的每个交易日，下个月再更新。
    high_value: 高分表示此前21天累计表现更弱，可能存在短期超跌。
    low_value: 低分表示此前21天累计上涨更多，不是这个反转信号偏好的方向。
    example: 若21天每日收益相加为-8%，取反后因子就是+8%，也就是0.08。
    watch_out: 它每月只更新一次，而且高分只代表近期跌得多，不保证随后一定反弹。
direction:
  expected: positive
  selection: high
  meaning: 正式样本RankIC为0.0280，因此当前样本优选高值端；这不是未来收益保证。
