formula:
  expression: Mean($volume,60)/($volume+1e-12)
  variables:
  - name: volume
    meaning: 当日成交股数
  interpretation: 用过去60天平均成交量除以今天成交量，判断今天是放量还是缩量。
  beginner_explanation:
    one_sentence: 用过去60天平均成交量除以今天成交量，判断今天是放量还是缩量。
    steps:
    - 计算最近60个交易日成交股数的平均值。
    - 用60日平均成交量除以今天成交量。
    high_value: 今天成交量低于60日平均，属于相对缩量。
    low_value: 今天成交量高于60日平均，属于相对放量。
    example: 60日平均每天成交100万股，今天成交50万股时因子为2；今天成交200万股时为0.5。
    watch_out: Q5费前年化超额4.14%、年单边换手约25倍；成交量使用原始股数，除权时的口径影响和交易成本尚未验证。
