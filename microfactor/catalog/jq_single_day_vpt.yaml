formula:
  expression: ((adjusted_close_t-adjusted_close_t[-1])/adjusted_close_t[-1])*volume_t
  variables:
  - name: adjusted_close
    meaning: 后复权收盘价，用来消除分红、送股等公司行为造成的机械跳变
  - name: volume
    meaning: 当日成交股数
  interpretation: 把当天涨跌幅乘以成交量，同时表示价格方向和交易力度。
  beginner_explanation:
    one_sentence: 把当天涨跌幅乘以成交量，同时表示价格方向和交易力度。
    steps:
    - 用今天与昨天的后复权收盘价计算单日收益率。
    - 把收益率乘以今天的成交股数。
    high_value: 股票放量上涨，正值较大。
    low_value: 股票放量下跌，负值绝对值较大。
    example: 股价从10元涨到10.20元且成交1000万股时，因子=2%*1000万=20万。
    watch_out: 数值量纲受公司成交规模影响，未做流动性中性化时可能主要是在比较大成交量股票。 本次正式样本RankIC为-0.0148，Q1费前年化超额为-8.51%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0148，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
implementation:
  path: research/factor-provenance/joinquant/scripts/joinquant_named_daily_factors.py
  callable: calculate_single_day_vpt / jq_single_day_vpt
evaluation:
  suite_id: base_panel_bottom1000_5d
  result_path: research/model-pipeline/output/evaluations/jq_single_day_vpt/factor_result.json
  factor_values_path: research/model-pipeline/output/evaluations/jq_single_day_vpt/factor_values.parquet
assessment:
  verdict: negative_preferred_tail
  summary: RankIC -0.0148，raw RankICIR -0.122，平均覆盖率99.97%；Q1费前年化超额-8.51%，年单边换手36.98倍。
  most_important_risk: 按RankIC方向选择的档位费前年化超额仍为-8.51%，不能支持单独做多。
risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 13个命名因子在同一样本集中评估，存在多重检验和样本内筛选偏差。
- 聚宽未披露所有停牌边界和滚动算子细节，不能声称逐行完全一致。
- 按RankIC方向选择的档位费前年化超额仍为-8.51%，不能支持单独做多。
