formula:
  expression: turn_1m / turn_24m - 1
  variables:
  - name: turnover_percent
    meaning: 当日换手率百分比
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 把最近1个月的热度与自己过去两年的常态相比，正数说明近期明显变热。
  beginner_explanation:
    one_sentence: 把最近1个月的热度与自己过去两年的常态相比，正数说明近期明显变热。
    steps:
    - 分别计算最近N个月和最近24个月的日均换手率。
    - 用短期均值除以24个月均值再减1，比较近期热度与长期常态。
    high_value: 股票近期比自己过去两年明显更热门、更拥挤。
    low_value: 近期交易热度低于自己的长期常态。
    example: 近1个月日均换手3%，24个月日均2%，因子值为3/2-1=50%。
    watch_out: 这是和股票自身历史比较，不是直接比较两只股票的绝对换手率。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0656，因此当前样本优选低值端；这不是未来收益保证。
