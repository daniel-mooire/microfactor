assessment:
  verdict: no_standalone_long_alpha
  summary: RankIC -0.0656，raw RankICIR -0.626，平均覆盖率73.58%；Q1费前年化超额-1.79%，年单边换手7.05倍。优选档自身费前年化超额为负，当前更像排除高风险尾部。
  most_important_risk: 覆盖率仅约74%，且优选档费前年化超额为负。
risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 同一批研报和参数在同一样本反复筛选，存在多重检验偏差。
- 覆盖率仅约74%，且优选档费前年化超额为负。
