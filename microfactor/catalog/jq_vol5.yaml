formula:
  expression: Mean(jq_turnover_ratio_pct, 5)_t
  variables:
  - name: jq_turnover_ratio_pct
    meaning: 成交股数 / 流通股本股数 * 100；分母是 float_share，不是自由流通股本 free_share
  interpretation: 看最近一周平均每天有多少流通股本被交易。
  beginner_explanation:
    one_sentence: 看最近一周平均每天有多少流通股本被交易。
    steps:
    - 每天计算成交股数占流通股本 float_share 的百分比。
    - 对最近5个交易日的百分比取平均。
    high_value: 最近一周换手频繁，短期关注度高。
    low_value: 最近一周换手较少，交易较冷清。
    example: 5天换手率依次为2%、3%、4%、3%、3%，平均值为3%。
    watch_out: 短窗口对单日异常成交很敏感，且不能用 free_share 口径的 turnover_percent 替代。 本次正式样本RankIC为-0.0922，Q1费前年化超额为7.74%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0922，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
