evaluation:
  suite_id: base_panel_bottom1000_5d
  result_path: research/model-pipeline/output/evaluations/reversal/factor_result.json
  factor_values_path: research/model-pipeline/output/evaluations/reversal/factor_values.parquet
assessment:
  verdict: not_standalone
  summary: RankIC为正，但优选Q5费前年化超额约-2.4%；正IC和多空差主要由极差的Q1推动，不支持直接做多最高分组。
  most_important_risk: 截面相关显著不代表long-only尾部收益为正，尾部结构必须单独检查。
risks:
- 年单边换手约40倍，费用压力高。
- 五档收益并非理想单调结构。
- 未核实唯一原始研报来源。
