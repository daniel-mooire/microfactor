formula:
  expression: factor[i,t] = -(TRI[i,t] / TRI[i,t-5] - 1)
  variables:
  - name: TRI
    meaning: 后复权总回报价格指数
  interpretation: 先算最近5日累计涨跌幅，再乘以负1，让近期跌得多的股票得到更高分。
  beginner_explanation:
    one_sentence: 专门寻找最近几天跌得较多、可能出现短期反弹的股票。
    steps:
    - 计算股票最近5个交易日的累计涨跌幅。
    - 给这个涨跌幅加上负号，也就是把正负方向反过来。
    - 最近下跌的股票因此得到正分，最近上涨的股票得到负分。
    high_value: 股票最近5日跌幅较大，公式认为它可能有短期回弹机会。
    low_value: 股票最近5日涨幅较大，公式认为它继续上涨的吸引力较低。
    example: 股价从10元跌到9元，5日收益是-10%；取负后因子是+10%。从10元涨到11元时，因子则是-10%。
    watch_out: 跌得多也可能是基本面变差，并非所有下跌都会反弹；当前高分档本身仍跑输等权基准。
direction:
  expected: positive
  selection: high
  meaning: 正式样本RankIC为正，方向与短期反转先验一致。
implementation:
  path: src/quant_hive/factor.py
