formula:
  expression: 'vwap[i,t] = amount[i,t] / volume[i,t]

    p[i,t] = Rank_t(TsMax_3(vwap-close)) + Rank_t(TsMin_3(vwap-close))

    q[i,t] = Rank_t(volume[i,t] - volume[i,t-3])

    factor[i,t] = p[i,t] * q[i,t]'
  variables:
  - name: Rank_t
    meaning: 同一交易日完整候选行情截面的百分位排名
  - name: TsMax_3 / TsMin_3
    meaning: 同一股票最近3个交易日的最大值和最小值
  - name: amount / volume
    meaning: 日成交额除以成交股数得到的日级VWAP代理
  interpretation: 比较最近3天收盘价相对当日平均成交价的位置，并结合成交量相对3天前的变化；各部分先在当日股票中排名，再相乘。
  beginner_explanation:
    one_sentence: 看股票最近收盘时是偏强还是偏弱，同时确认成交量有没有跟着变大。
    steps:
    - 用当天成交额除以成交量，估算大家当天买卖的平均价格，也就是VWAP。
    - 比较最近3天的收盘价和这个平均价格；收盘价越低于平均价，vwap减close越大。
    - 比较今天成交量和3个交易日前成交量的差值。
    - 把价格位置和成交量变化分别与当天其他股票排名，再把排名结果相乘。
    high_value: 最近收盘价相对平均成交价偏低，同时成交量增加在全市场中也较靠前。
    low_value: 收盘价没有明显低于平均成交价，或者成交量没有明显增加，至少有一项排名靠后。
    example: 一只股票当天平均成交价是10.20元、收盘价是10.00元，而且成交量比3天前明显增加，它更容易得到较高分。
    watch_out: 这个公式不是简单的“放量上涨”，高分也未在当前评估中带来足够的可交易超额收益。
