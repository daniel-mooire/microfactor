formula:
  expression: Resi($close,60)/$close
  variables:
  - name: adjusted_close
    meaning: 后复权收盘价
  interpretation: 用一条直线描述过去60天的价格趋势，再看今天价格比这条趋势线高或低多少。
  beginner_explanation:
    one_sentence: 用一条直线描述过去60天的价格趋势，再看今天价格比这条趋势线高或低多少。
    steps:
    - 对最近60天后复权收盘价按时间拟合一条直线。
    - 用今天实际收盘价减去趋势线对今天的估计价，得到残差。
    - 再用残差除以今天收盘价，使不同价位股票可比较。
    high_value: 今天价格高于60日趋势线，短期跑到了长期直线上方。
    low_value: 今天价格低于60日趋势线；正式样本偏好这一端。
    example: 趋势线估计今天应为10元，实际收盘10.20元，则残差为0.20元，因子约为0.20/10.20=1.96%。
    watch_out: Q1费前年化超额仅1.35%、年单边换手约21倍；它与BIAS24的平均日截面相关绝对值达0.7943，接近0.80冗余阈值。
