assessment:
  verdict: moderate_positive_evidence
  summary: RankIC -0.0566，raw RankICIR -0.499，平均覆盖率96.78%；Q1费前年化超额5.45%，年单边换手10.42倍。
  most_important_risk: 绝对RankIC为0.0566、优选档费前年化超额为5.45%，证据温和但仍未计成本。
risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 13个命名因子在同一样本集中评估，存在多重检验和样本内筛选偏差。
- 聚宽未披露所有停牌边界和滚动算子细节，不能声称逐行完全一致。
- 绝对RankIC为0.0566、优选档费前年化超额为5.45%，证据温和但仍未计成本。
