formula:
  expression: Mean(jq_turnover_ratio_pct, 20)_t / Mean(jq_turnover_ratio_pct, 120)_t
  variables:
  - name: jq_turnover_ratio_pct
    meaning: 成交股数 / 流通股本股数 * 100；分母是 float_share，不是自由流通股本 free_share
  interpretation: 比较最近一个月和过去半年的换手热度，判断交易是在升温还是降温。
  beginner_explanation:
    one_sentence: 比较最近一个月和过去半年的换手热度，判断交易是在升温还是降温。
    steps:
    - 分别计算最近20日和最近120日的平均流通股本换手率。
    - 用20日均值除以120日均值；长期均值为0时不计算。
    high_value: 近期换手明显高于半年常态，交易热度正在上升。
    low_value: 近期换手低于半年常态，交易热度正在下降。
    example: 20日平均换手率4%、120日平均2%时，因子=4%/2%=2，表示近期约是常态的两倍。
    watch_out: 突然放量可能来自利好，也可能来自出货；换手率仍严格使用 float_share 口径。 本次正式样本RankIC为-0.0566，Q1费前年化超额为5.45%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0566，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
