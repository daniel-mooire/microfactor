formula:
  expression: raw_close_t
  variables:
  - name: close
    meaning: 当日未复权收盘价
  interpretation: 直接拿当天行情软件显示的原始收盘价给股票打分。
  beginner_explanation:
    one_sentence: 直接拿当天行情软件显示的原始收盘价给股票打分。
    steps:
    - 读取当天未复权收盘价。
    - 不做滚动计算，也不把分红送股造成的价格跳变接回去。
    high_value: 股票的名义每股价格较高。
    low_value: 股票的名义每股价格较低。
    example: A股收盘20元、B股收盘5元时，两者因子分别就是20和5。
    watch_out: 名义股价不等于公司贵或便宜；拆股、送股和除权会机械改变数值。 本次正式样本RankIC为-0.0172，Q1费前年化超额为0.90%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0172，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
