  summary: RankIC -0.0172，raw RankICIR -0.103，平均覆盖率100.00%；Q1费前年化超额0.90%，年单边换手4.20倍。
  most_important_risk: 绝对RankIC仅0.0172且优选档费前年化超额仅0.90%，独立证据偏弱。
risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 13个命名因子在同一样本集中评估，存在多重检验和样本内筛选偏差。
- 聚宽未披露所有停牌边界和滚动算子细节，不能声称逐行完全一致。
- 绝对RankIC仅0.0172且优选档费前年化超额仅0.90%，独立证据偏弱。
