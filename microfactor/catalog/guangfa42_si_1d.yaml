formula:
  expression: AA=abs(H-LC); BB=abs(L-LC); CC=abs(H-L[t-1]); DD=abs(LC-O[t-1]); R=piecewise(AA,BB,CC,DD); X=C-LC+(C-O)/2+LC-O[t-1];
    SI=16*X/R*max(AA,BB)
  variables:
  - name: open
    meaning: 当日未复权开盘价
  - name: high
    meaning: 当日未复权最高价
  - name: low
    meaning: 当日未复权最低价
  - name: close
    meaning: 当日未复权收盘价
  interpretation: 把今天和昨天的开高低收变化合成一个带方向的单日价格冲击分数。
  beginner_explanation:
    one_sentence: 把今天和昨天的开高低收变化合成一个带方向的单日价格冲击分数。
    steps:
    - 比较今天高低价与昨天收盘、昨天最低价和昨天开盘的距离。
    - 按研报分支选择波动尺度R，并计算价格变化X。
    - 用X除以R，再乘当天主要波动距离，得到SI。
    high_value: 当天价格冲击更偏向上行。
    low_value: 当天价格冲击更偏向下行，但本样本低值档本身没有正毛超额。
    example: 昨天收10元，今天开10元、最高10.5元、最低9.8元、收10.3元时，SI通常为正。
    watch_out: 这是单日信号，年单边换手接近37倍；负RankIC主要来自回避最高值端。
direction:
