formula:
  expression: Mean(amount, 6)_t
  variables:
  - name: amount
    meaning: 当日成交金额（人民币元）
  interpretation: 计算最近6天平均每天成交了多少钱，衡量短期资金承载量。
  beginner_explanation:
    one_sentence: 计算最近6天平均每天成交了多少钱，衡量短期资金承载量。
    steps:
    - 读取最近6个交易日的成交金额。
    - 把6天成交金额相加后除以6。
    high_value: 近期成交金额大，交易较活跃、通常容量也更高。
    low_value: 近期成交金额小，股票较冷清、下单冲击风险可能更高。
    example: 6天成交额合计12亿元时，TVMA6=12/6=2亿元。
    watch_out: 成交额同时受市值、股价和活跃度影响，不能直接理解为资金净买入。 本次正式样本RankIC为-0.1063，Q1费前年化超额为10.45%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.1063，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
