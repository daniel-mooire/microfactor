formula:
  expression: factor[i,t] = TRI[i,t] / TRI[i,t-20] - 1
  variables:
  - name: TRI
    meaning: 后复权总回报价格指数
  interpretation: 用今天的复权价格除以20个交易日前的复权价格再减1，直接衡量最近20日累计涨跌幅。
  beginner_explanation:
    one_sentence: 看一只股票过去大约一个月是涨得多，还是跌得多。
    steps:
    - 找到今天和20个交易日前的复权价格。
    - 用今天价格除以过去价格，再减去1，得到这20天的累计涨跌幅。
    - 涨得越多分数越高，跌得越多分数越低。
    high_value: 股票最近20个交易日涨幅较大，属于近期强势股。
    low_value: 股票最近20个交易日涨幅较小，甚至出现明显下跌。
    example: 复权价格从10元涨到11元，动量约为10%；从10元跌到9元，动量约为-10%。
    watch_out: 这个名字虽然叫动量，但当前微盘样本中反而是低分股票未来表现更好，不能机械追涨。
direction:
  expected: positive
  selection: low
  meaning: 正式微盘样本RankIC为负，实际有效方向是低动量端，与预设动量方向相反。
