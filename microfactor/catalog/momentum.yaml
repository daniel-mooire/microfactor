assessment:
  verdict: direction_mismatch
  summary: 绝对RankIC较高但符号为负，说明20日动量在该微盘池表现为中期反转；低分档费前年化超额约1.6%，不能按原正向动量假设使用。
  most_important_risk: 因子方向与先验相反，可能高度依赖微盘股票池、样本阶段和拥挤交易。
risks:
- 未做行业或市值中性化。
- 负RankIC不能直接解释为正向动量有效。
- 未核实唯一原始研报来源。
