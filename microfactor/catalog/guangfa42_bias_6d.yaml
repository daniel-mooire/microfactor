formula:
  expression: BIAS_6=100*(close-MA_6(close))/MA_6(close)
  variables:
  - name: close
    meaning: 当日未复权收盘价
  interpretation: 看今天股价比最近6天平均价高或低多少百分比。
  beginner_explanation:
    one_sentence: 看今天股价比最近6天平均价高或低多少百分比。
    steps:
    - 计算最近6个交易日收盘价的平均值。
    - 用今天收盘价减去均价。
    - 再除以均价并乘100，得到乖离率。
    high_value: 今天价格明显站在6日均线上方，短期涨幅较大。
    low_value: 今天价格低于6日均线，短期相对偏弱。
    example: 6日均价10元、今天收11元，BIAS6等于10%；收9元则为-10%。
    watch_out: 低值端费前超额仍为负，当前结果更像排除过热股票，不能理解成抄底必赚。
