formula:
  expression: Mean(log(high_i/open_i), i=t-10..t-1)
  variables:
  - name: high
    meaning: 当日未复权最高价
  - name: open
    meaning: 当日未复权开盘价
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 看信号日前10天里，股票每天从开盘价向上冲到最高价的幅度平均有多大。
  beginner_explanation:
    one_sentence: 看信号日前10天里，股票每天从开盘价向上冲到最高价的幅度平均有多大。
    steps:
    - 每天用最高价除以开盘价，再取自然对数，得到当天盘中向上冲的相对幅度。
    - 严格排除信号日，只使用此前10个交易日；停牌日不参与平均。
    - 把有效日的数值取平均；超过一半日期停牌时不计算。
    high_value: 过去10天经常出现明显的盘中冲高；正式样本反而偏好低值端。
    low_value: 过去10天从开盘到最高价的上冲幅度通常较小。
    example: 开盘10元、最高10.50元时，当天数值约为ln(1.05)=4.88%；10天平均约4%时，因子约为0.04。
    watch_out: 绝对RankIC虽高，但它来自大范围样本内筛选且年单边换手约22倍；5.26%只是未扣费用的Q1年化超额。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0917，因此当前样本优选低值端；这不是未来收益保证。
