formula:
  expression: (IdxMax($high,20)-IdxMin($low,20))/20
  variables:
  - name: high
    meaning: 当日未复权最高价
  - name: low
    meaning: 当日未复权最低价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 后复权收盘价
  interpretation: 比较最近20天最高点和最低点出现的先后顺序，区分先跌后涨还是先涨后跌。
  beginner_explanation:
    one_sentence: 比较最近20天最高点和最低点出现的先后顺序，区分先跌后涨还是先涨后跌。
    steps:
    - 从旧到新给最近20天编号1到20，并找出最高价和最低价第一次出现的位置。
    - 用最高点位置减去最低点位置，再除以20。
    high_value: 最低点先出现、最高点后出现，更像先跌后涨。
    low_value: 最高点先出现、最低点后出现，更像先涨后跌。
    example: 最低点在第4天、最高点在第16天，因子=(16-4)/20=0.60；顺序相反则为-0.60。
    watch_out: 离散位置会产生大量并列值和空分档警告；Q1费前年化超额为-1.98%，不能把负RankIC当成可做多信号。
