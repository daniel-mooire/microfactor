formula:
  expression: Std(adjusted_high_d / previous_adjusted_close - 1, (t-1m,t], ddof=0)
  variables:
  - name: high
    meaning: 当日未复权最高价
  - name: low
    meaning: 当日未复权最低价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 当日后复权收盘价
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 看每天盘中最好一刻的涨幅是否忽大忽小。 观察窗口是最近1个月。
  beginner_explanation:
    one_sentence: 看每天盘中最好一刻的涨幅是否忽大忽小。 观察窗口是最近1个月。
    steps:
    - 把每日最高价按收盘复权比例调整，并和上一有效交易日复权收盘比较。
    - 计算最近N个自然月这些盘中最高涨幅的总体标准差。
    high_value: 每天盘中最好一刻的涨幅差异很大，上冲幅度不稳定。
    low_value: 盘中最高涨幅较稳定。
    example: 若三天最高涨幅为1%、3%、8%，其标准差会明显高于都在2%左右的股票。
    watch_out: 停牌日剔除，普通缺失不填；公司行为通过复权比例处理。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0923，因此当前样本优选低值端；这不是未来收益保证。
