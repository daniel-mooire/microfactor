assessment:
  verdict: strong_but_capacity_limited
  summary: 本批因子中绝对RankIC最高，五档单调，低成交额Q1费前年化超额约10.6%且换手相对较低；仍未达到项目20%目标。
  most_important_risk: 因子很可能是微盘池内部残余规模和不可交易容量的直接代理，费前统计优势未必能变成可实现收益。
risks:
- 成交额越低通常冲击成本越高，容量与收益方向冲突。
- 未做市值、流动性或行业中性化。
- 未核实唯一原始研报来源。
