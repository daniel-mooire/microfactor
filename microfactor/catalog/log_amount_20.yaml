formula:
  expression: factor[i,t] = ln(Mean_20(amount[i,*]))
  variables:
  - name: amount
    meaning: 单日成交额，要求为正
  - name: Mean_20
    meaning: 最近20个完整交易日的算术平均
  interpretation: 先算最近20天平均每天成交了多少钱，再取自然对数压缩股票之间过大的金额差距。
  beginner_explanation:
    one_sentence: 看一只股票最近每天大约有多少钱在里面买卖。
    steps:
    - 统计股票最近20个交易日每天的成交金额。
    - 算出20天的日均成交额。
    - 对平均成交额取对数，压缩几百万元和几亿元之间的巨大差距，但不改变大小顺序。
    high_value: 最近日均成交金额较大，通常更活跃、关注度更高，也更容易买卖。
    low_value: 最近日均成交金额较小，通常更冷门，买卖容量也更有限。
    example: 日均成交1亿元的股票仍会比日均成交1000万元的股票分数高；取对数只是把两者的数值差距压小。
    watch_out: 当前样本中低成交额股票表现更好，但这类股票往往最难大额成交，回测收益可能被冲击成本吃掉。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC显著为负，低成交额端未来相对收益更高。
