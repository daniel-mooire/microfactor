formula:
  expression: Std(turnover_d, d in (t-1m,t], ddof=0)
  variables:
  - name: turnover_percent
    meaning: 当日换手率百分比
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 看最近1个月交易热度是否忽冷忽热，数值越大越不稳定。
  beginner_explanation:
    one_sentence: 看最近1个月交易热度是否忽冷忽热，数值越大越不稳定。
    steps:
    - 取最近N个自然月每天的换手率，明确停牌且缺失的换手记为0。
    - 计算这些日换手率的总体标准差，观察交易热度是否忽冷忽热。
    high_value: 近期交易热度变化很大，时而拥挤、时而冷清。
    low_value: 近期换手率较稳定。
    example: 三天换手率1%、1%、4%，总体标准差约1.41个百分点。
    watch_out: 研报没有说明ddof，本实现固定ddof=0；普通缺失会让整个窗口无效。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0823，因此当前样本优选低值端；这不是未来收益保证。
