formula:
  expression: ts_corr((amount_CNY / volume_shares) / high, high, 10)
  variables:
  - name: high
    meaning: 当日未复权最高价
  - name: amount
    meaning: 当日成交金额（人民币元）
  - name: volume
    meaning: 当日成交股数
  interpretation: 看过去10天里，全天平均成交价靠近最高价的程度，是否会和最高价一起变化。
  beginner_explanation:
    one_sentence: 看过去10天里，全天平均成交价靠近最高价的程度，是否会和最高价一起变化。
    steps:
    - 每天用成交额除以成交股数，得到平均每股成交价。
    - 再用平均成交价除以当天最高价，得到成交重心离最高点有多近。
    - 对最近10天的这个比例和最高价计算相关性。
    high_value: 两条序列经常同涨同跌；本样本中高值端未来表现较好。
    low_value: 成交重心位置和最高价经常反向变化，或同步关系很弱。
    example: 若最高价从10元逐步升到11元，同时成交均价/最高价从0.95升到0.98，相关性会偏高。
    watch_out: 相关性不代表因果；零成交、停牌和极端价格会影响结果，而且未扣交易费用。
direction:
  expected: positive
  selection: high
  meaning: 正式样本RankIC为+0.0476，因此当前样本优选高值端；这不是未来收益保证。
