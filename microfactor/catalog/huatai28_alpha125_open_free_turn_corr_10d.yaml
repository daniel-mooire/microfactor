formula:
  expression: ts_corr(open - free_turn_percent, close, 10)
  variables:
  - name: open
    meaning: 当日未复权开盘价
  - name: close
    meaning: 当日未复权收盘价
  - name: turnover_percent
    meaning: 当日自由流通换手率百分比
  interpretation: 看“开盘价减换手率”这条序列，过去10天是否和收盘价同步。
  beginner_explanation:
    one_sentence: 看“开盘价减换手率”这条序列，过去10天是否和收盘价同步。
    steps:
    - 每天从开盘价中减去自由流通换手率的百分数。
    - 取最近10天的差值序列和收盘价序列。
    - 计算两条序列的相关性，越同步分数越高。
    high_value: 差值序列与收盘价大多同向变化；正式样本偏好高值端。
    low_value: 两条序列反向或缺少稳定同步关系。
    example: 某日开盘10元、换手率2%，公式先得到8；连续10天的这些数再与收盘价做相关。
    watch_out: 价格和百分数直接相减的量纲不自然，这是研报原式；结果强到必须检查流动性和市值暴露。
direction:
  expected: positive
  selection: high
  meaning: 正式样本RankIC为+0.0714，因此当前样本优选高值端；这不是未来收益保证。
