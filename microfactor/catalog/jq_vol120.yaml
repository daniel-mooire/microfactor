  verdict: moderate_positive_but_redundant
  summary: RankIC -0.0476，raw RankICIR -0.371，平均覆盖率96.78%；Q1费前年化超额4.80%，年单边换手4.14倍。 高相关同族候选：jq_vol60(+0.904)。
  most_important_risk: 与jq_vol60的每日截面Spearman中位数为+0.904，需先做同族去重。
risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 13个命名因子在同一样本集中评估，存在多重检验和样本内筛选偏差。
- 聚宽未披露所有停牌边界和滚动算子细节，不能声称逐行完全一致。
- 同日截面因子值与以下因子高度相关，组合前应做残差化或择一：jq_vol60(+0.904)。
- 与jq_vol60的每日截面Spearman中位数为+0.904，需先做同族去重。
