formula:
  expression: Mean(jq_turnover_ratio_pct, 120)_t
  variables:
  - name: jq_turnover_ratio_pct
    meaning: 成交股数 / 流通股本股数 * 100；分母是 float_share，不是自由流通股本 free_share
  interpretation: 看过去约半年里，每天平均有多少流通股本被交易。
  beginner_explanation:
    one_sentence: 看过去约半年里，每天平均有多少流通股本被交易。
    steps:
    - 每天用成交股数除以流通股本股数，再乘100得到百分比换手率。
    - 把最近120个交易日的换手率取平均。
    high_value: 过去半年筹码交换频繁，股票较活跃，也可能较拥挤。
    low_value: 过去半年筹码交换较少，股票较冷清。
    example: 120天换手率合计为360%，平均值就是360%/120=3%。
    watch_out: 这里的分母是流通股本 float_share，不是项目既有 turnover_percent 使用的 free_share，两者不能混用。 本次正式样本RankIC为-0.0476，Q1费前年化超额为4.80%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0476，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
