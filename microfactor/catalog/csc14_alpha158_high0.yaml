formula:
  expression: $high/$open
  variables:
  - name: open
    meaning: 当日未复权开盘价
  - name: high
    meaning: 当日未复权最高价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 后复权收盘价
  interpretation: 用当天最高价除以开盘价，直接看盘中最高时比开盘高了多少。
  beginner_explanation:
    one_sentence: 用当天最高价除以开盘价，直接看盘中最高时比开盘高了多少。
    steps:
    - 取得当天经过同一复权比例处理的最高价和开盘价。
    - 用最高价除以开盘价；减去1即可理解为盘中最大上冲百分比。
    high_value: 盘中曾经明显高于开盘价，冲高幅度大。
    low_value: 最高价与开盘价接近，盘中向上空间小。
    example: 开盘10元、最高10.50元时，HIGH0=1.05，也就是盘中最多比开盘高5%。
    watch_out: Q1费前年化超额仍为-0.39%，年单边换手约39倍；当前证据最多支持回避极端冲高，不能支持做多低值端。
