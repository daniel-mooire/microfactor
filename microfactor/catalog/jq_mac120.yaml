formula:
  expression: Mean(adjusted_close, 120)_t / adjusted_close_t
  variables:
  - name: adjusted_close
    meaning: 后复权收盘价，用来消除分红、送股等公司行为造成的机械跳变
  interpretation: 用半年平均价除以今天股价，衡量今天相对半年中枢有多高或多低。
  beginner_explanation:
    one_sentence: 用半年平均价除以今天股价，衡量今天相对半年中枢有多高或多低。
    steps:
    - 计算最近120个交易日后复权收盘价的平均值。
    - 用这个平均值除以今天的后复权收盘价。
    high_value: 今天股价低于半年均价，数值会大于1。
    low_value: 今天股价高于半年均价，数值会小于1。
    example: 120日均价12元、今天10元时，因子=12/10=1.20。
    watch_out: 它与常见MACD指标不是一回事，本质上与Price1Y一类价格位置因子可能高度重复。 本次正式样本RankIC为+0.0742，Q5费前年化超额为4.73%。
direction:
  expected: unspecified
  selection: high
  meaning: 正式样本RankIC为+0.0742，因此当前样本优选高值端；这是样本内方向，不是未来收益保证。
