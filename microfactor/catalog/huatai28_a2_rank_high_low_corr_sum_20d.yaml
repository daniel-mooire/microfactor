formula:
  expression: ts_sum(rank_cross_section(ts_corr(high, low, 20)), 20)
  variables:
  - name: high
    meaning: 当日未复权最高价
  - name: low
    meaning: 当日未复权最低价
  interpretation: 看一只股票的最高价和最低价是否长期同步变化，并把它每天在全市场的相对名次累加起来。
  beginner_explanation:
    one_sentence: 看一只股票的最高价和最低价是否长期同步变化，并把它每天在全市场的相对名次累加起来。
    steps:
    - 对每只股票计算最近20天最高价与最低价的相关性；越接近1，说明两者越常同涨同跌。
    - 在同一天把所有股票的相关性从低到高排名，并换成0到1之间的百分位名次。
    - 把最近20天的百分位名次相加，得到最终分数。
    high_value: 这只股票连续多天都属于高低价同步性较强的一组。
    low_value: 这只股票的高低价同步性长期弱于同日其他股票。
    example: 若一只股票连续20天的百分位名次平均为0.80，累加分数约为16；平均为0.30则约为6。
    watch_out: 嵌套窗口至少需要39个交易日，而且名次会随股票池变化；本样本RankIC仅+0.0091，Q5费前年化超额为-0.87%。
direction:
  expected: positive
  selection: high
  meaning: 正式样本RankIC为+0.0091，因此当前样本优选高值端；这不是未来收益保证。
