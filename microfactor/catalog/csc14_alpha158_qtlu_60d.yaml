formula:
  expression: Quantile($close,60,0.8)/$close
  variables:
  - name: adjusted_close
    meaning: 后复权收盘价
  interpretation: 把过去60天较高位置的参考价除以今天价格，看今天相对历史上沿是高还是低。
  beginner_explanation:
    one_sentence: 把过去60天较高位置的参考价除以今天价格，看今天相对历史上沿是高还是低。
    steps:
    - 把最近60天后复权收盘价从低到高排列。
    - 取80%分位数，也就是大约八成价格不超过的较高参考价。
    - 用这个参考价除以今天收盘价。
    high_value: 今天价格相对历史较高参考线偏低，或距离上沿较远。
    low_value: 今天价格已接近或超过过去60天的较高价格区间。
    example: 60日80%分位价为12元、今天收10元时因子为1.20；今天收12元时为1.00。
    watch_out: Q5费前年化超额1.87%、年单边换手约15倍；它与BIAS24及QTLD60相关较高，需先去重再组合。
