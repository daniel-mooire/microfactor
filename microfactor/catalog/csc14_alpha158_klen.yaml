formula:
  expression: ($high-$low)/$open
  variables:
  - name: open
    meaning: 当日未复权开盘价
  - name: high
    meaning: 当日未复权最高价
  - name: low
    meaning: 当日未复权最低价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 后复权收盘价
  interpretation: 用当天最高价到最低价的完整振幅，除以开盘价，衡量这一天有多剧烈。
  beginner_explanation:
    one_sentence: 用当天最高价到最低价的完整振幅，除以开盘价，衡量这一天有多剧烈。
    steps:
    - 用当天最高价减去最低价，得到全天价格跨度。
    - 再除以当天开盘价，让不同股价水平的股票可以比较。
    high_value: 当天振幅相对开盘价很大，盘中波动剧烈。
    low_value: 当天价格活动范围较窄，盘中相对平稳。
    example: 开盘10元、最高10.50元、最低9.50元时，KLEN=(10.50-9.50)/10=0.10。
    watch_out: 负RankIC主要伴随高值端表现很差；Q1费前年化超额仅1.15%、年单边换手约32倍，不足以证明低振幅端可交易。
