formula:
  expression: OLS_slope(close[t-5:t] ~ ordinal[1:6])
  variables:
  - name: close
    meaning: 当日未复权收盘价
  interpretation: 用一条直线概括最近6天收盘价每天大约上涨或下跌多少元。
  beginner_explanation:
    one_sentence: 用一条直线概括最近6天收盘价每天大约上涨或下跌多少元。
    steps:
    - 按先后顺序排列最近6天收盘价。
    - 用普通最小二乘拟合价格对时间的直线。
    - 取直线斜率作为因子值。
    high_value: 拟合直线向上，近期价格趋势偏强。
    low_value: 拟合直线向下，近期价格趋势偏弱。
    example: 价格从10元大致匀速涨到11元，斜率约为每天0.2元；反向下跌则为负。
    watch_out: 用“元/天”计量会受股价高低影响，且Q1毛超额仅约0.46%、年换手约38倍。
