formula:
  expression: 'for every trading day in calendar month c: close_total_return_index(month_end(c-1)) / close_total_return_index(month_end(c-3))
    - 1'
  variables:
  - name: close_total_return_index
    meaning: 包含分红、送转等公司行为影响的后复权收盘总回报价格指数
  interpretation: 每月只算一次，看股票在刚过去的2个月一共涨了还是跌了，然后整个月都沿用这个分数。
  beginner_explanation:
    one_sentence: 每月只算一次，看股票在刚过去的2个月一共涨了还是跌了，然后整个月都沿用这个分数。
    steps:
    - 等上个自然月最后一个交易日收盘，记下该日的总回报价格指数。
    - 找到再往前2个月的月末指数，用上月末数值除以它再减1。
    - 把算出的涨跌幅复制到本月每个交易日，下个月才重新计算。
    high_value: 数值越高，表示股票在刚过去的2个月涨得越多；本研报的反转思路并不认为高值更好。
    low_value: 数值越低，表示股票在刚过去的2个月更弱；研报检验的是弱势股随后是否更容易反弹。
    example: 较早月末为100、上月末为90，因子就是90/100-1=-10%；这个-10%在本月内保持不变。
    watch_out: 负RankIC表示低分股票未来相对更好，不是高分越好；Q1费前年化超额只有0.55%，不能直接当作强买入信号。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0342，因此当前样本优选低值端；这不是未来收益保证。
