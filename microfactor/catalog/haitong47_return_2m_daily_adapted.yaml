  most_important_risk: Q1费前年化超额仅0.55%，Q2和Q3更高，主要价值是回避Q5的-9.36%；年单边换手10.05倍。
risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 同一批研报和参数在同一样本反复筛选，存在多重检验偏差。
- Q1费前年化超额仅0.55%，Q2和Q3更高，主要价值是回避Q5的-9.36%；年单边换手10.05倍。
