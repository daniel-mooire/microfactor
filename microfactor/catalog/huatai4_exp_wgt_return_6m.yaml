formula:
  expression: sum(w_d * total_return_1d_d) / sum(w_d), w_d = turnover_d * exp(-x_d / 6 / 4)
  variables:
  - name: close_to_close_total_return_1d
    meaning: 当日收盘到前一交易日收盘的总收益率
  - name: turnover_percent
    meaning: 当日换手率百分比
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 在换手率加权上再让越靠近今天的日子权重越大，观察近6个月近期且放量的涨跌。
  beginner_explanation:
    one_sentence: 在换手率加权上再让越靠近今天的日子权重越大，观察近6个月近期且放量的涨跌。
    steps:
    - 取最近N个自然月每天的总收益率和换手率；只有明确停牌且换手缺失时才把换手记为0。
    - 先给越靠近今天的交易日乘上exp(-x/N/4)衰减，再按换手率做加权平均。
    high_value: 成交活跃的日子整体上涨较多，数值会偏高。
    low_value: 成交活跃的日子整体下跌较多，研报主要检验低值端是否反转。
    example: 两天收益为-2%和+1%，换手率为3%和1%，普通加权值约为(-2%×3+1%×1)/4=-1.25%。
    watch_out: 普通缺失不能填0；指数衰减中的N按研报写法取1、3、6、12，x是距信号日的交易日数。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0876，因此当前样本优选低值端；这不是未来收益保证。
