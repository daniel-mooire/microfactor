formula:
  expression: Std(total_return_1d, d in (t-4m,t], ddof=0)
  variables:
  - name: close_to_close_total_return_1d
    meaning: 当日收盘到前一交易日收盘的总收益率
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 看股票最近4个月每天涨跌有多颠簸，越大越像坐过山车。
  beginner_explanation:
    one_sentence: 看股票最近4个月每天涨跌有多颠簸，越大越像坐过山车。
    steps:
    - 取指定自然月或固定交易日窗口内的股票日总收益率。
    - 剔除明确停牌日后计算总体标准差。
    high_value: 股票近期每天涨跌更颠簸。
    low_value: 股票近期日收益更稳定。
    example: 三天收益为-2%、0%、2%，总体标准差约1.63%。
    watch_out: 自然月版本与固定交易日版本不是同一公式；普通缺失会让窗口无效。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0656，因此当前样本优选低值端；这不是未来收益保证。
