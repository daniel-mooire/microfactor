formula:
  expression: 'on each day in calendar month t: product(monthly_total_return[m], m=t-12..t-1) - 1'
  variables:
  - name: close_total_return_index
    meaning: 后复权总回报价格指数
  interpretation: 每天沿用上月末已知的过去12个月累计涨跌，完全跳过当前月。
  beginner_explanation:
    one_sentence: 每天沿用上月末已知的过去12个月累计涨跌，完全跳过当前月。
    steps:
    - 找到当前月份之前已经完整结束的月份。
    - 把此前连续12个月的总回报逐月连乘。
    - 同一个月内每天沿用同一分数，次月再更新。
    high_value: 更早的12个月累计涨幅较大，属于长期强势股。
    low_value: 更早的12个月表现较弱或下跌；正式样本的RankIC偏向低值端。
    example: 若12个月总回报连乘后由1变成1.20，因子约为20%；当前月涨跌不计入。
    watch_out: 这是日频持有式适配，不是研报原来的月末调仓；Q1费前超额仍为负，不能直接做多。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0284，因此当前样本优选低值端；这不是未来收益保证。
