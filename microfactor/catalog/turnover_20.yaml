formula:
  expression: factor[i,t] = Mean_20(turnover_pct[i,*])
  variables:
  - name: turnover_pct
    meaning: 成交量除以自由流通股本的换手率百分数，要求非负
  - name: Mean_20
    meaning: 最近20个完整交易日的算术平均
  interpretation: 先算每天成交股数占自由流通股本的比例，再取最近20天平均值，衡量股票筹码换手有多频繁。
  beginner_explanation:
    one_sentence: 看一只股票的流通筹码最近换手有多勤快，是热门还是冷门。
    steps:
    - 用每天成交股数除以可自由交易的流通股数，得到当日换手率。
    - 把最近20个交易日的换手率加总后取平均。
    - 平均换手越频繁，因子分数越高。
    high_value: 很多流通筹码近期反复被买卖，股票较热门，也可能比较拥挤。
    low_value: 流通筹码很少换手，股票较冷门，也可能不容易成交。
    example: 自由流通股有1亿股，当天成交500万股，当日换手率约为5%；连续20天平均后得到本因子。
    watch_out: 低换手在回测中表现较好，不代表实盘容易赚钱；成交太冷清会增加买卖冲击和退出难度。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC显著为负，低换手端未来相对收益更高。
