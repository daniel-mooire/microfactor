assessment:
  verdict: negative_preferred_tail
  summary: RankIC -0.0277，raw RankICIR -0.369，平均覆盖率99.28%；Q1费前年化超额-1.42%，年单边换手16.80倍。
  most_important_risk: 按RankIC方向选择的档位费前年化超额仍为-1.42%，不能支持单独做多。
risks:
- 未做行业、市值或流动性中性化，不能把相关暴露自动解释成纯Alpha。
- 五档收益未扣手续费、滑点和微盘冲击成本。
- 13个命名因子在同一样本集中评估，存在多重检验和样本内筛选偏差。
- 聚宽未披露所有停牌边界和滚动算子细节，不能声称逐行完全一致。
- 按RankIC方向选择的档位费前年化超额仍为-1.42%，不能支持单独做多。
