formula:
  expression: 100*Sum(adjusted_high-adjusted_open,26)/Sum(adjusted_open-adjusted_low,26) - 100*Sum(adjusted_high-prev_adjusted_close,26)/Sum(prev_adjusted_close-adjusted_low,26)
  variables:
  - name: open
    meaning: 当日未复权开盘价；需要时与同日复权比例相乘得到后复权开盘价
  - name: high
    meaning: 当日未复权最高价；需要时与同日复权比例相乘得到后复权最高价
  - name: low
    meaning: 当日未复权最低价；需要时与同日复权比例相乘得到后复权最低价
  - name: close
    meaning: 当日未复权收盘价
  - name: adjusted_close
    meaning: 后复权收盘价，用来消除分红、送股等公司行为造成的机械跳变
  - name: is_suspended
    meaning: 当日是否明确停牌
  interpretation: 把开盘后的上冲力量和相对昨收的上冲力量作比较，观察两种短期情绪谁更强。
  beginner_explanation:
    one_sentence: 把开盘后的上冲力量和相对昨收的上冲力量作比较，观察两种短期情绪谁更强。
    steps:
    - 用26天的最高价减开盘价与开盘价减最低价，计算AR。
    - 再用最高价减前收盘与前收盘减最低价计算BR，最后用AR减BR。
    high_value: 相对开盘价计算的上冲力量明显强于相对昨收计算的力量。
    low_value: BR相对更强，或者开盘后的上冲力量较弱。
    example: 若AR=140、BR=90，则ARBR=140-90=50；若AR=80、BR=120，则为-40。
    watch_out: 它不是简单的涨跌幅；分母为0时没有数值，停牌和一字板也会影响窗口。 本次正式样本RankIC为-0.0277，Q1费前年化超额为-1.42%。
direction:
  expected: unspecified
  selection: low
  meaning: 正式样本RankIC为-0.0277，因此当前样本优选低值端；这是样本内方向，不是未来收益保证。
