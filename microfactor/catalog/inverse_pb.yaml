evaluation:
  suite_id: base_panel_bottom1000_5d
  result_path: research/model-pipeline/output/evaluations/inverse_pb/factor_result.json
  factor_values_path: research/model-pipeline/output/evaluations/inverse_pb/factor_values.parquet
assessment:
  verdict: promising_research_signal
  summary: RankIC约0.0453、raw ICIR约0.414、五档单调性约0.784，Q5费前年化超额约2.25%，且平均覆盖率约99.6%。
  most_important_risk: 低PB可能是资产质量差或盈利能力弱的价值陷阱，未做行业中性化会放大该问题。
risks:
- 账面净资产可能含商誉、坏账或难变现资产，低PB不等于清算价值高。
- 未做行业中性化，银行、地产与轻资产行业PB不可直接机械比较。
- Q4费前年化超额高于Q5，最便宜尾部并非完全单调占优。
- 结果未计交易费用和微盘冲击成本。
