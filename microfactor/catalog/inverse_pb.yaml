formula:
  expression: factor[i,t] = 1 / PB[i,t], only when PB[i,t] > 0
  variables:
  - name: PB
    meaning: 股价相对于每股账面净资产的倍数
  - name: 1 / PB
    meaning: 每1元股价对应多少元账面净资产，也称BP
  interpretation: PB越低，倒数越高，表示投资者为同样一元账面净资产支付的市场价格越少。
  beginner_explanation:
    one_sentence: 同样有1元账面净资产，股价付得越少，这个因子分数越高。
    steps:
    - 查看公司股价是每股账面净资产的多少倍，也就是PB。
    - 只有PB为正时才取倒数。
    - 倒数越高，代表每1元股价能对应更多账面净资产。
    high_value: 股票相对账面净资产便宜，可能存在价值折价，也可能说明市场担心资产质量或盈利能力。
    low_value: 股票相对账面净资产昂贵，市场可能为品牌、成长或高盈利能力支付溢价。
    example: PB为0.8倍时因子为1.25，PB为2倍时因子为0.5；前者分数更高。
    watch_out: 账面净资产不等于能变现的钱；坏账、商誉、过时资产和行业差异都会让低PB看起来比实际更便宜。
direction:
  expected: positive
  selection: high
  meaning: 先验与正式样本RankIC均为正，优选高BP的Q5。
implementation:
  path: research/factor-provenance/reports/scripts/report_factors.py
