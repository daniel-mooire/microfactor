formula:
  expression: Std($close,5)/$close
  variables:
  - name: adjusted_close
    meaning: 后复权收盘价
  interpretation: 把最近5天收盘价的波动大小除以今天价格，比较哪只股票近期更稳定。
  beginner_explanation:
    one_sentence: 把最近5天收盘价的波动大小除以今天价格，比较哪只股票近期更稳定。
    steps:
    - 取最近5个交易日的后复权收盘价。
    - 计算这5个价格的样本标准差，衡量它们围绕平均价的分散程度。
    - 用标准差除以今天收盘价，消除股票价格高低带来的量纲差异。
    high_value: 最近5天相对波动较大，价格不稳定。
    low_value: 最近5天价格较平稳；正式样本偏好这一端。
    example: 5天价格的标准差为0.20元、今天收盘10元时，因子为0.20/10=0.02。
    watch_out: Q1费前年化超额3.61%，但年单边换手约36倍，且因子来自大范围样本内筛选，费用和样本外稳定性尚未验证。
