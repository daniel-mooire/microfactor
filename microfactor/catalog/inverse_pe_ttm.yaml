  result_path: research/model-pipeline/output/evaluations/inverse_pe_ttm/factor_result.json
  factor_values_path: research/model-pipeline/output/evaluations/inverse_pe_ttm/factor_values.parquet
assessment:
  verdict: not_standalone
  summary: RankIC约0.0241、raw ICIR约0.231，方向符合价值直觉，但Q5费前年化超额仅约0.23%，独立收益较弱。
  most_important_risk: 只覆盖正PE盈利公司，约68.6%的平均覆盖率会产生盈利公司样本选择。
risks:
- 亏损和非正PE公司留空，不能把缺失理解为低分。
- 未处理一次性利润、周期利润高点和会计质量。
- 未做行业中性化，金融、周期等行业估值不可直接横比。
- 费前long-only超额接近零，更适合作为组合中的弱信息。
