formula:
  expression: factor[i,t] = 1 / PE_TTM[i,t], only when PE_TTM[i,t] > 0
  variables:
  - name: PE_TTM
    meaning: 股价相对于最近12个月每股利润的倍数
  - name: 1 / PE_TTM
    meaning: 每1元股价对应多少元最近12个月利润，也称盈利收益率
  interpretation: 在盈利公司中，PE越低，倒数越高，代表为同样一元近期利润支付的价格越少。
  beginner_explanation:
    one_sentence: 同样赚1元利润，市场给的价格越低，这个因子分数越高。
    steps:
    - 查看公司最近12个月利润对应的PE_TTM。
    - 只有PE_TTM为正时才取倒数；亏损公司直接留空。
    - 倒数越大，表示每1元股价对应的近期利润越多。
    high_value: 正PE公司相对便宜，盈利收益率较高；这可能是低估，也可能是市场在补偿风险。
    low_value: 正PE公司相对昂贵，每1元股价对应的近期利润较少。
    example: PE_TTM为10倍时因子是10%，20倍时是5%；前者分数更高。
    watch_out: 低PE不保证便宜，周期高点的利润、一次性收益或公司风险都可能让PE暂时看起来很低。
direction:
  expected: positive
  selection: high
  meaning: 先验与正式样本RankIC均为正，优选高盈利收益率Q5。
