formula:
  expression: 'for every trading day in calendar month c: close_total_return_index(month_end(c-1)) / close_total_return_index(month_end(c-10))
    - 1'
  variables:
  - name: close_total_return_index
    meaning: 包含分红、送转等公司行为影响的后复权收盘总回报价格指数
  interpretation: 每月只更新一次，看上月末的复权价格比9个月前月末涨了还是跌了，然后整个月都用同一个分数。
  beginner_explanation:
    one_sentence: 每月只更新一次，看上月末的复权价格比9个月前月末涨了还是跌了，然后整个月都用同一个分数。
    steps:
    - 等上个自然月的最后一个交易日收盘，记下该日的总回报价格指数。
    - 找到9个自然月前的月末总回报价格指数，用上月末数值除以它再减1。
    - 把这个结果复制到当月的每个交易日；当月价格怎么变都不重算，下月再更新。
    high_value: 数值越高，表示截至上月末的9个月涨得越多；研报中这一端之后反而偏弱。
    low_value: 数值越低，表示截至上月末的9个月跌得越多；研报检验的是这些弱势股之后是否反弹。
    example: 1月末总回报价格为10、10月末为8，则因子为8/10-1=-20%；这个-20%在11月每个交易日都保持不变。
    watch_out: 这是将研报月末信号沿用到日频评估的明示适配；负RankIC表示低值端相对更好，不是高值越好。本次Q1费前年化超额只有1.90%，不应当成可直接做多的强Alpha。
direction:
  expected: negative
  selection: low
  meaning: 正式样本RankIC为-0.0359，因此当前样本优选低值端；这不是未来收益保证。
