- 五档收益未扣手续费、滑点和微盘冲击成本。
- 同一批研报和参数在同一样本反复筛选，存在多重检验偏差。
- Q1费前年化超额仅1.90%，Q2和Q3更高，主要价值是回避Q5的-10.36%；不是可直接做多的强Alpha。
